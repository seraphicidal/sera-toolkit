name: sera

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SERA_DOMAIN: ${SERA_DOMAIN:?set SERA_DOMAIN, e.g. 1-2-3-4.sslip.io}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy.globals:/etc/caddy/globals:ro
      - ./deploy/caddy.sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - edge-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=64m
    pids_limit: 128
    deploy:
      resources:
        limits:
          memory: 256m

  web:
    image: ${SERA_IMAGE_WEB:-ghcr.io/seraphicidal/sera-web:latest}
    restart: unless-stopped
    environment:
      SERA_API_URL: http://api:4000
      NEXT_PUBLIC_OPERATOR_NAME: ${NEXT_PUBLIC_OPERATOR_NAME:-${OPERATOR_NAME:-SERA.toolkit Operator}}
      NEXT_PUBLIC_OPERATOR_ADDRESS: ${NEXT_PUBLIC_OPERATOR_ADDRESS:-${OPERATOR_ADDRESS:-Online Service Provider, EU / Global}}
      NEXT_PUBLIC_OPERATOR_EMAIL: ${NEXT_PUBLIC_OPERATOR_EMAIL:-${OPERATOR_EMAIL:-}}
      NEXT_PUBLIC_OPERATOR_REGISTRATION_ID: ${NEXT_PUBLIC_OPERATOR_REGISTRATION_ID:-${OPERATOR_REGISTRATION_ID:-}}
      NEXT_PUBLIC_CONTACT_EMAIL_AUTHORITIES: ${NEXT_PUBLIC_CONTACT_EMAIL_AUTHORITIES:-${CONTACT_EMAIL_AUTHORITIES:-}}
      NEXT_PUBLIC_CONTACT_EMAIL_LEGAL: ${NEXT_PUBLIC_CONTACT_EMAIL_LEGAL:-${CONTACT_EMAIL_LEGAL:-}}
    expose:
      - '3000'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge-net
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=64m
      - /app/apps/web/.next/cache:noexec,nosuid,nodev,size=128m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512m

  api:
    image: ${SERA_IMAGE_API:-ghcr.io/seraphicidal/sera-api:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERA_SECRET: ${SERA_SECRET:?set SERA_SECRET — see .env.example}
      SERA_CORS_ORIGINS: ${SERA_CORS_ORIGINS:-}
      SERA_QUEUE_DRIVER: redis
      SERA_REDIS_URL: ${SERA_REDIS_URL:-redis://:${SERA_REDIS_PASSWORD:?set SERA_REDIS_PASSWORD in .env — see .env.example}@redis:6379}
      SERA_EMBEDDED_WORKER: 'false'
      SERA_DATA_DIR: /data
      SERA_RETENTION_SECONDS: ${SERA_RETENTION_SECONDS:-1800}
      SERA_REAP_INTERVAL_SECONDS: ${SERA_REAP_INTERVAL_SECONDS:-120}
      SERA_OPTION_TTL_SECONDS: ${SERA_OPTION_TTL_SECONDS:-3600}
      SERA_MAX_FILESIZE_BYTES: ${SERA_MAX_FILESIZE_BYTES:-2147483648}
      SERA_MAX_DURATION_SECONDS: ${SERA_MAX_DURATION_SECONDS:-10800}
      SERA_MAX_ITEMS_PER_JOB: ${SERA_MAX_ITEMS_PER_JOB:-25}
      SERA_JOB_TIMEOUT_SECONDS: ${SERA_JOB_TIMEOUT_SECONDS:-1800}
      SERA_RESOLVE_TIMEOUT_SECONDS: ${SERA_RESOLVE_TIMEOUT_SECONDS:-45}
      SERA_RESOLVE_TIMEOUT_YOUTUBE_SECONDS: ${SERA_RESOLVE_TIMEOUT_YOUTUBE_SECONDS:-60}
      SERA_RESOLVE_TIMEOUT_INSTAGRAM_SECONDS: ${SERA_RESOLVE_TIMEOUT_INSTAGRAM_SECONDS:-30}
      SERA_RESOLVE_TIMEOUT_TWITTER_SECONDS: ${SERA_RESOLVE_TIMEOUT_TWITTER_SECONDS:-25}
      SERA_RESOLVE_TIMEOUT_REDDIT_SECONDS: ${SERA_RESOLVE_TIMEOUT_REDDIT_SECONDS:-25}
      SERA_MAX_QUEUE_DEPTH: ${SERA_MAX_QUEUE_DEPTH:-200}
      SERA_RATE_LIMIT_RESOLVE_PER_MINUTE: ${SERA_RATE_LIMIT_RESOLVE_PER_MINUTE:-20}
      SERA_RATE_LIMIT_JOBS_PER_MINUTE: ${SERA_RATE_LIMIT_JOBS_PER_MINUTE:-8}
      SERA_MAX_CONCURRENT_JOBS_PER_CLIENT: ${SERA_MAX_CONCURRENT_JOBS_PER_CLIENT:-2}
      SERA_TRUST_PROXY: ${SERA_TRUST_PROXY:-1}
      SERA_REDDIT_CLIENT_ID: ${SERA_REDDIT_CLIENT_ID:-}
      SERA_REDDIT_CLIENT_SECRET: ${SERA_REDDIT_CLIENT_SECRET:-}
      SERA_YOUTUBE_PLAYER_CLIENTS: ${SERA_YOUTUBE_PLAYER_CLIENTS:-}
      SERA_YOUTUBE_POT_PROVIDER_URL: ${SERA_YOUTUBE_POT_PROVIDER_URL:-}
      SERA_EXTRACTION_NODE_TOKENS: ${SERA_EXTRACTION_NODE_TOKENS:-}
      SERA_EXTRACTION_NODE_TOKEN: ${SERA_EXTRACTION_NODE_TOKEN:-}
      SERA_EXTRACTION_WORKER_TOKEN: ${SERA_EXTRACTION_WORKER_TOKEN:-}
      SERA_EXTRACTION_CLAIM_HOLD_SECONDS: ${SERA_EXTRACTION_CLAIM_HOLD_SECONDS:-25}
      SERA_EXTRACTION_PROXY_URL: ${SERA_EXTRACTION_PROXY_URL:-}
      SERA_EXTRACTION_PROXY_PROVIDERS: ${SERA_EXTRACTION_PROXY_PROVIDERS:-}
      SERA_CANARY_TOKEN: ${SERA_CANARY_TOKEN:-}
      SERA_ADMIN_TOKEN: ${SERA_ADMIN_TOKEN:-}
      SERA_ALERT_NTFY_TOPIC: ${SERA_ALERT_NTFY_TOPIC:-}
      SERA_DOMAIN: ${SERA_DOMAIN:-}
      SERA_INSTAGRAM_SESSION_ID: ${SERA_INSTAGRAM_SESSION_ID:-}
      SERA_EXTRA_ALLOWED_HOSTS: ${SERA_EXTRA_ALLOWED_HOSTS:-}
      SERA_BLOCKED_HOSTS: ${SERA_BLOCKED_HOSTS:-}
      SERA_ENABLED_PROVIDERS: ${SERA_ENABLED_PROVIDERS:-}
      SERA_DISABLED_PROVIDERS: ${SERA_DISABLED_PROVIDERS:-}
      SERA_ALLOW_PRIVATE_ADDRESSES: ${SERA_ALLOW_PRIVATE_ADDRESSES:-false}
      CONTACT_EMAIL_AUTHORITIES: ${CONTACT_EMAIL_AUTHORITIES:-}
      CONTACT_EMAIL_LEGAL: ${CONTACT_EMAIL_LEGAL:-}
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      OPERATOR_ADDRESS: ${OPERATOR_ADDRESS:-}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
      OPERATOR_REGISTRATION_ID: ${OPERATOR_REGISTRATION_ID:-}
      SERA_NETWORK_CLASS: ${SERA_NETWORK_CLASS:-datacenter}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - '4000'
    volumes:
      - media:/data
    read_only: true
    tmpfs:
      - /tmp:exec,nosuid,nodev,size=256m
    pids_limit: 256
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - edge-net
      - internal-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 1g

  worker:
    image: ${SERA_IMAGE_API:-ghcr.io/seraphicidal/sera-api:latest}
    restart: unless-stopped
    stop_grace_period: 10m
    command: ['node', 'apps/worker/dist/index.js']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const{statSync}=require('node:fs');const age=Date.now()-statSync('/data/.worker-alive').mtimeMs;process.exit(age<60000?0:1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    environment:
      NODE_ENV: production
      SERA_SECRET: ${SERA_SECRET:?set SERA_SECRET — see .env.example}
      SERA_QUEUE_DRIVER: redis
      SERA_REDIS_URL: ${SERA_REDIS_URL:-redis://:${SERA_REDIS_PASSWORD:?set SERA_REDIS_PASSWORD in .env — see .env.example}@redis:6379}
      SERA_DATA_DIR: /data
      SERA_WORKER_CONCURRENCY: ${SERA_WORKER_CONCURRENCY:-2}
      SERA_ITEM_CONCURRENCY: ${SERA_ITEM_CONCURRENCY:-3}
      SERA_FFMPEG_THREADS: ${SERA_FFMPEG_THREADS:-2}
      SERA_API_URL: http://api:4000
      SERA_RETENTION_SECONDS: ${SERA_RETENTION_SECONDS:-1800}
      SERA_REAP_INTERVAL_SECONDS: ${SERA_REAP_INTERVAL_SECONDS:-120}
      SERA_MAX_FILESIZE_BYTES: ${SERA_MAX_FILESIZE_BYTES:-2147483648}
      SERA_MAX_DURATION_SECONDS: ${SERA_MAX_DURATION_SECONDS:-10800}
      SERA_MAX_ITEMS_PER_JOB: ${SERA_MAX_ITEMS_PER_JOB:-25}
      SERA_JOB_TIMEOUT_SECONDS: ${SERA_JOB_TIMEOUT_SECONDS:-1800}
      SERA_RESOLVE_TIMEOUT_SECONDS: ${SERA_RESOLVE_TIMEOUT_SECONDS:-45}
      SERA_RESOLVE_TIMEOUT_YOUTUBE_SECONDS: ${SERA_RESOLVE_TIMEOUT_YOUTUBE_SECONDS:-60}
      SERA_RESOLVE_TIMEOUT_INSTAGRAM_SECONDS: ${SERA_RESOLVE_TIMEOUT_INSTAGRAM_SECONDS:-30}
      SERA_RESOLVE_TIMEOUT_TWITTER_SECONDS: ${SERA_RESOLVE_TIMEOUT_TWITTER_SECONDS:-25}
      SERA_RESOLVE_TIMEOUT_REDDIT_SECONDS: ${SERA_RESOLVE_TIMEOUT_REDDIT_SECONDS:-25}
      SERA_REDDIT_CLIENT_ID: ${SERA_REDDIT_CLIENT_ID:-}
      SERA_REDDIT_CLIENT_SECRET: ${SERA_REDDIT_CLIENT_SECRET:-}
      SERA_YOUTUBE_PLAYER_CLIENTS: ${SERA_YOUTUBE_PLAYER_CLIENTS:-}
      SERA_YOUTUBE_POT_PROVIDER_URL: ${SERA_YOUTUBE_POT_PROVIDER_URL:-}
      SERA_EXTRACTION_NODE_TOKENS: ${SERA_EXTRACTION_NODE_TOKENS:-}
      SERA_EXTRACTION_NODE_TOKEN: ${SERA_EXTRACTION_NODE_TOKEN:-}
      SERA_EXTRACTION_WORKER_TOKEN: ${SERA_EXTRACTION_WORKER_TOKEN:-}
      SERA_EXTRACTION_CLAIM_HOLD_SECONDS: ${SERA_EXTRACTION_CLAIM_HOLD_SECONDS:-25}
      SERA_EXTRACTION_PROXY_URL: ${SERA_EXTRACTION_PROXY_URL:-}
      SERA_EXTRACTION_PROXY_PROVIDERS: ${SERA_EXTRACTION_PROXY_PROVIDERS:-}
      SERA_INSTAGRAM_SESSION_ID: ${SERA_INSTAGRAM_SESSION_ID:-}
      SERA_EXTRA_ALLOWED_HOSTS: ${SERA_EXTRA_ALLOWED_HOSTS:-}
      SERA_BLOCKED_HOSTS: ${SERA_BLOCKED_HOSTS:-}
      SERA_ENABLED_PROVIDERS: ${SERA_ENABLED_PROVIDERS:-}
      SERA_DISABLED_PROVIDERS: ${SERA_DISABLED_PROVIDERS:-}
      SERA_ALLOW_PRIVATE_ADDRESSES: ${SERA_ALLOW_PRIVATE_ADDRESSES:-false}
      CONTACT_EMAIL_AUTHORITIES: ${CONTACT_EMAIL_AUTHORITIES:-}
      CONTACT_EMAIL_LEGAL: ${CONTACT_EMAIL_LEGAL:-}
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      OPERATOR_ADDRESS: ${OPERATOR_ADDRESS:-}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
      OPERATOR_REGISTRATION_ID: ${OPERATOR_REGISTRATION_ID:-}
      SERA_NETWORK_CLASS: ${SERA_NETWORK_CLASS:-datacenter}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - media:/data
    read_only: true
    tmpfs:
      - /tmp:exec,nosuid,nodev,size=256m
    pids_limit: 256
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - internal-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '${SERA_WORKER_CPUS:-2}'
          memory: ${SERA_WORKER_MEMORY:-3g}

  potoken:
    image: brainicism/bgutil-ytdlp-pot-provider:latest@sha256:d7d34108b76e52c7d3b575fe9e797e4bf41c1b2a08f80c5292eff6f851ce8472
    profiles: ['potoken']
    restart: unless-stopped
    expose:
      - '4416'
    networks:
      - internal-net
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=128m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - su-exec
      - redis
      - sh
      - -ec
      - |
        umask 077
        escaped=$$(printf '%s' "$$REDISCLI_AUTH" | sed 's/\\/\\\\/g; s/"/\\"/g')
        printf 'requirepass "%s"\n' "$$escaped" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf --save '3600 1' --appendonly no --maxmemory 256mb --maxmemory-policy noeviction
    environment:
      REDISCLI_AUTH: ${SERA_REDIS_PASSWORD:?set SERA_REDIS_PASSWORD in .env — see .env.example}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal-net
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=16m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    deploy:
      resources:
        limits:
          memory: 384m

networks:
  edge-net:
  internal-net:

volumes:
  media:
  caddy_data:
  caddy_config:
  redis_data:
