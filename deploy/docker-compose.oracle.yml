# SERA.toolkit — public deployment behind Caddy.
#
# Written for Oracle Cloud's always-free Ampere instance, but nothing here is
# Oracle-specific: it is the standard stack with TLS termination in front, and it runs on
# any host with Docker. The images are pulled from GitHub's registry for both amd64 and
# arm64, so no build toolchain is needed on the server.
#
#   cd /opt/sera && docker compose -f deploy/docker-compose.oracle.yml up -d
#
# Required in .env: SERA_SECRET, SERA_DOMAIN.

name: sera

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SERA_DOMAIN: ${SERA_DOMAIN:?set SERA_DOMAIN, e.g. 1-2-3-4.sslip.io}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Optional global options, written by provisioning. Empty is the normal case.
      - ./deploy/caddy.globals:/etc/caddy/globals:ro
      # Certificates survive restarts. Without this, every `up` re-requests from Let's
      # Encrypt and a few restarts in a row hit the rate limit.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    security_opt:
      - no-new-privileges:true

  web:
    image: ${SERA_IMAGE_WEB:-ghcr.io/seraphicidal/sera-web:latest}
    restart: unless-stopped
    environment:
      # Must match the value the image was BUILT with, because Next bakes the /api/*
      # rewrite destination into the standalone bundle and only server components read
      # this at runtime. That is also why the service above is named exactly `api`.
      SERA_API_URL: http://api:4000
    # No published port: Caddy reaches it over the compose network. The only thing
    # listening on a public interface is Caddy.
    expose:
      - '3000'
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      # /about revalidates, and Next writes the incremental cache to disk when it does.
      # Without this the only writable path is /tmp and the render logs EROFS every
      # minute.
      - /app/apps/web/.next/cache
    security_opt:
      - no-new-privileges:true

  api:
    image: ${SERA_IMAGE_API:-ghcr.io/seraphicidal/sera-api:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERA_SECRET: ${SERA_SECRET:?set SERA_SECRET — see .env.example}
      SERA_QUEUE_DRIVER: redis
      SERA_REDIS_URL: redis://redis:6379
      # Workers run in their own containers, so the API only serves HTTP.
      SERA_EMBEDDED_WORKER: 'false'
      SERA_DATA_DIR: /data
      SERA_RETENTION_SECONDS: ${SERA_RETENTION_SECONDS:-1800}
      SERA_MAX_FILESIZE_BYTES: ${SERA_MAX_FILESIZE_BYTES:-2147483648}
      SERA_MAX_DURATION_SECONDS: ${SERA_MAX_DURATION_SECONDS:-10800}
      SERA_MAX_ITEMS_PER_JOB: ${SERA_MAX_ITEMS_PER_JOB:-25}
      SERA_RATE_LIMIT_RESOLVE_PER_MINUTE: ${SERA_RATE_LIMIT_RESOLVE_PER_MINUTE:-20}
      SERA_RATE_LIMIT_JOBS_PER_MINUTE: ${SERA_RATE_LIMIT_JOBS_PER_MINUTE:-8}
      SERA_MAX_CONCURRENT_JOBS_PER_CLIENT: ${SERA_MAX_CONCURRENT_JOBS_PER_CLIENT:-2}
      # Caddy and the Next proxy sit in front, so the forwarded address is the real one.
      SERA_TRUST_PROXY: 'true'
      # Reddit's Data API. Without these Reddit reports that it needs credentials
      # instead of failing per link — it refuses anonymous requests from servers.
      SERA_REDDIT_CLIENT_ID: ${SERA_REDDIT_CLIENT_ID:-}
      SERA_REDDIT_CLIENT_SECRET: ${SERA_REDDIT_CLIENT_SECRET:-}
      # A yt-dlp PO Token Provider. Start one with `--profile potoken`; measured on this
      # host it does not lift YouTube's datacentre challenge, so it is off by default.
      SERA_YOUTUBE_POT_PROVIDER_URL: ${SERA_YOUTUBE_POT_PROVIDER_URL:-}
      # Lets an extraction node on another network claim work. Empty leaves the
      # endpoints unmounted entirely. See deploy/EXTRACTION-NODE.md.
      SERA_EXTRACTION_NODE_TOKEN: ${SERA_EXTRACTION_NODE_TOKEN:-}
      # An Instagram session for photo posts. Read the warning in deploy/ORACLE.md
      # before setting this on a deployment other people can reach.
      SERA_INSTAGRAM_SESSION_ID: ${SERA_INSTAGRAM_SESSION_ID:-}
      # This host is a datacentre and YouTube refuses it on every player client, so a
      # connected node is asked first rather than after a refusal nobody needs to pay
      # for. With no node connected this changes nothing.
      SERA_NETWORK_CLASS: ${SERA_NETWORK_CLASS:-datacenter}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - '4000'
    volumes:
      - media:/data
    depends_on:
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  worker:
    image: ${SERA_IMAGE_API:-ghcr.io/seraphicidal/sera-api:latest}
    restart: unless-stopped
    command: ['node', 'apps/worker/dist/index.js']
    # The worker runs the API image and has no HTTP surface, so it cannot answer the
    # healthcheck baked into that image — which is why it reported unhealthy from the
    # moment it started while completing every job it was given. It touches a file from
    # its event loop instead; a worker whose loop has wedged stops touching it.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const{statSync}=require('node:fs');const age=Date.now()-statSync('/data/.worker-alive').mtimeMs;process.exit(age<60000?0:1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    environment:
      NODE_ENV: production
      SERA_SECRET: ${SERA_SECRET:?set SERA_SECRET — see .env.example}
      SERA_QUEUE_DRIVER: redis
      SERA_REDIS_URL: redis://redis:6379
      SERA_DATA_DIR: /data
      SERA_WORKER_CONCURRENCY: ${SERA_WORKER_CONCURRENCY:-2}
      SERA_RETENTION_SECONDS: ${SERA_RETENTION_SECONDS:-1800}
      SERA_MAX_FILESIZE_BYTES: ${SERA_MAX_FILESIZE_BYTES:-2147483648}
      SERA_MAX_DURATION_SECONDS: ${SERA_MAX_DURATION_SECONDS:-10800}
      # Reddit's Data API. Without these Reddit reports that it needs credentials
      # instead of failing per link — it refuses anonymous requests from servers.
      SERA_REDDIT_CLIENT_ID: ${SERA_REDDIT_CLIENT_ID:-}
      SERA_REDDIT_CLIENT_SECRET: ${SERA_REDDIT_CLIENT_SECRET:-}
      # A yt-dlp PO Token Provider. Start one with `--profile potoken`; measured on this
      # host it does not lift YouTube's datacentre challenge, so it is off by default.
      SERA_YOUTUBE_POT_PROVIDER_URL: ${SERA_YOUTUBE_POT_PROVIDER_URL:-}
      # Lets an extraction node on another network claim work. Empty leaves the
      # endpoints unmounted entirely. See deploy/EXTRACTION-NODE.md.
      SERA_EXTRACTION_NODE_TOKEN: ${SERA_EXTRACTION_NODE_TOKEN:-}
      # An Instagram session for photo posts. Read the warning in deploy/ORACLE.md
      # before setting this on a deployment other people can reach.
      SERA_INSTAGRAM_SESSION_ID: ${SERA_INSTAGRAM_SESSION_ID:-}
      # This host is a datacentre and YouTube refuses it on every player client, so a
      # connected node is asked first rather than after a refusal nobody needs to pay
      # for. With no node connected this changes nothing.
      SERA_NETWORK_CLASS: ${SERA_NETWORK_CLASS:-datacenter}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # The same volume as the API: the worker writes the file, the API serves it.
      - media:/data
    depends_on:
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          # Transcoding will otherwise take the whole machine, and on a shared-tenancy
          # free instance that gets noticed.
          cpus: '${SERA_WORKER_CPUS:-2}'
          memory: ${SERA_WORKER_MEMORY:-3g}

  # yt-dlp's PO Token Provider, as described in its PO-Token-Guide. Off unless asked
  # for: `sudo sera --profile potoken up -d`, with
  # SERA_YOUTUBE_POT_PROVIDER_URL=http://potoken:4416 in .env.
  #
  # It was measured on this deployment and does not lift the "Sign in to confirm you're
  # not a bot" challenge, which YouTube applies to the player request on address
  # reputation. PO tokens address 403s on the stream. A host with a clean address still
  # wants this for the web clients.
  potoken:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    profiles: ['potoken']
    restart: unless-stopped
    expose:
      - '4416'
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # noeviction, not an LRU policy: this Redis holds a work queue, not a cache. Under
    # allkeys-lru it would evict live job records and BullMQ's own bookkeeping to stay
    # under the cap — jobs vanishing mid-download with nothing in the logs. BullMQ warns
    # about it on every worker connection, and it is right to. With noeviction a full
    # Redis refuses new writes instead, which surfaces as a job that would not start.
    command: >
      redis-server
      --save ''
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy noeviction
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true

volumes:
  # Named, not a bind mount: this holds media meant to be deleted, and a named volume is
  # actually removed by `docker compose down -v`.
  media:
  caddy_data:
  caddy_config:
