name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      - name: Install yt-dlp
        run: |
          VERSION=$(node -p "require('./scripts/tools.manifest.json').ytdlp.version")
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o /tmp/yt-dlp \
            "https://github.com/yt-dlp/yt-dlp/releases/download/${VERSION}/yt-dlp_linux"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o /tmp/SHA2-256SUMS \
            "https://github.com/yt-dlp/yt-dlp/releases/download/${VERSION}/SHA2-256SUMS"
          EXPECTED=$(grep ' yt-dlp_linux$' /tmp/SHA2-256SUMS | cut -d' ' -f1)
          ACTUAL=$(sha256sum /tmp/yt-dlp | cut -d' ' -f1)
          test -n "$EXPECTED" && test "$EXPECTED" = "$ACTUAL"
          sudo install -m 0755 /tmp/yt-dlp /usr/local/bin/yt-dlp
          yt-dlp --version

      - name: Format
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          SERA_TEST_REDIS_URL: redis://127.0.0.1:6379

      - name: Build
        run: npm run build

      - name: Lint the deploy scripts
        run: shellcheck deploy/*.sh deploy/node-android/*.sh

      - name: Check the API URL is the same at build time and run time
        run: |
          baked=$(sed -n 's/^ARG SERA_API_URL=//p' docker/web.Dockerfile)
          runtime=$(sed -n 's/^[[:space:]]*SERA_API_URL:[[:space:]]*//p' deploy/docker-compose.oracle.yml | head -n 1)
          echo "built with: $baked"
          echo "run with:   $runtime"
          test -n "$baked" && test "$baked" = "$runtime"

      - name: Check Redis cannot evict the queue
        run: |
          status=0
          files=$(git ls-files '*compose*.yml' '*compose*.yaml')
          test -n "$files"
          for file in $files; do
            caps=$(grep -c -- '--maxmemory[[:space:]]' "$file" || true)
            policies=$(grep -o -- '--maxmemory-policy[[:space:]]*[^[:space:]]*' "$file" | awk '{print $2}' || true)
            echo "$file: maxmemory x$caps, policy: ${policies:-none}"
            for policy in $policies; do
              test "$policy" = noeviction || { echo "::error file=$file::maxmemory-policy $policy can evict queued jobs"; status=1; }
            done
            if [ "$caps" -gt 0 ] && [ -z "$policies" ]; then
              echo "::error file=$file::--maxmemory without an explicit --maxmemory-policy noeviction"
              status=1
            fi
          done
          exit $status

      - name: Check every documented setting still exists
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { execSync } from "node:child_process";

            const schema = readFileSync("packages/engine/src/config.ts", "utf8");
            const notAppConfig = new Set([
              "SERA_API_URL",
              "SERA_NODE_ID",
              "SERA_NODE_PROVIDERS",
              "SERA_NODE_NETWORK_CLASS",
              "SERA_WEB_PORT",
              "SERA_WORKER_CPUS",
              "SERA_WORKER_MEMORY",
              "SERA_IMAGE_API",
              "SERA_IMAGE_WEB",
              "SERA_DOMAIN",
              "SERA_TLS_EMAIL",
              "SERA_REPO",
              "SERA_DIR",
              "SERA_PUBLIC_IP",
              "SERA_ALERT_NTFY_TOPIC",
              "SERA_ALERT_REPO",
              "SERA_NODE_DIR",
              "SERA_NODE_CHECK_SECONDS",
            ]);
            const files = execSync(
              "git ls-files .env.example deploy docker",
              { encoding: "utf8" },
            ).split("\n").filter(Boolean);

            const unknown = new Map();
            for (const file of files) {
              for (const [, name] of readFileSync(file, "utf8").matchAll(/\b(SERA_[A-Z0-9_]+)\b/g)) {
                if (notAppConfig.has(name)) continue;
                if (schema.includes(name)) continue;
                if (!unknown.has(name)) unknown.set(name, new Set());
                unknown.get(name).add(file);
              }
            }

            if (unknown.size) {
              for (const [name, where] of unknown) {
                console.error(name + "  <- " + [...where].join(", "));
              }
              console.error("\nThese are named outside the code but are not in the config schema.");
              process.exit(1);
            }
            console.log("every documented SERA_* setting exists in the schema");
          '

      - name: Validate the Caddyfile
        run: |
          mkdir -p /tmp/globals-none /tmp/globals-email
          echo 'email ci@example.test' > /tmp/globals-email/email.caddy
          for globals in /tmp/globals-none /tmp/globals-email; do
            echo "== globals: $globals"
            docker run --rm -e SERA_DOMAIN=example.test -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$globals:/etc/caddy/globals:ro" caddy:2.11-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done

  images:
    name: Build container images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: verify
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_API: ghcr.io/${{ github.repository_owner }}/sera-api
      IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/sera-web
      PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image (amd64, for verification)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_API }}:verify
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Verify the API image has working media tools
        run: |
          docker run --rm --entrypoint yt-dlp "$IMAGE_API:verify" --version
          docker run --rm --entrypoint ffmpeg "$IMAGE_API:verify" -version | head -n 1
          docker run --rm --entrypoint ffprobe "$IMAGE_API:verify" -version | head -n 1

      - name: Verify the API and worker images boot against Redis
        run: |
          docker network create sera-ci >/dev/null
          docker run -d --name sera-redis-ci --network sera-ci redis:7.4-alpine >/dev/null

          common="-e NODE_ENV=production
            -e SERA_SECRET=ci-smoke-secret-not-used-in-production
            -e SERA_QUEUE_DRIVER=redis
            -e SERA_REDIS_URL=redis://sera-redis-ci:6379"

          # shellcheck disable=SC2086
          docker run -d --name sera-api-ci --network sera-ci $common -e SERA_EMBEDDED_WORKER=false -p 4000:4000 "$IMAGE_API:verify" >/dev/null
          # shellcheck disable=SC2086
          docker run -d --name sera-worker-ci --network sera-ci $common "$IMAGE_API:verify" node apps/worker/dist/index.js >/dev/null

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/health >/dev/null 2>&1; then break; fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:4000/health | tee /tmp/health.json
          node -e "
            const r = require('/tmp/health.json');
            if (r.status !== 'ok') { console.error('health not ok:', r); process.exit(1); }
            console.log('health ok, version', r.version);
          "
          curl -fsS http://127.0.0.1:4000/ready > /dev/null

          for name in sera-api-ci sera-worker-ci; do
            echo "== $name"
            docker logs "$name" 2>&1 | tail -n 20
            running=$(docker inspect -f '{{.State.Running}}' "$name")
            restarts=$(docker inspect -f '{{.RestartCount}}' "$name")
            test "$running" = true || { echo "$name is not running"; exit 1; }
            test "$restarts" = 0 || { echo "$name restarted $restarts time(s)"; exit 1; }
          done

          docker rm -f sera-api-ci sera-worker-ci sera-redis-ci >/dev/null
          docker network rm sera-ci >/dev/null

      - name: Build web image (amd64, build check)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_WEB }}:verify
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Verify the web image boots and proxies to the API
        run: |
          docker network create sera-web-ci >/dev/null
          docker run -d --name sera-redis-web-ci --network sera-web-ci redis:7.4-alpine >/dev/null
          docker run -d --name sera-api-web-ci --network sera-web-ci --network-alias api -e NODE_ENV=production -e SERA_SECRET=ci-smoke-secret-not-used-in-production -e SERA_QUEUE_DRIVER=redis -e SERA_REDIS_URL=redis://sera-redis-web-ci:6379 "$IMAGE_API:verify" >/dev/null
          docker run -d --name sera-web-ci --network sera-web-ci -e SERA_API_URL=http://sera-api-web-ci:4000 --read-only --tmpfs /tmp --tmpfs /app/apps/web/.next/cache -p 3000:3000 "$IMAGE_WEB:verify" >/dev/null

          for _ in $(seq 1 40); do
            if docker exec sera-api-web-ci node -e "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then break; fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:3000/ | grep -q 'SERA' || { echo 'home page did not render'; exit 1; }
          curl -fsS http://127.0.0.1:3000/health | grep -q '"status":"ok"' || { echo 'rewrite to the API did not work'; exit 1; }
          curl -fsS http://127.0.0.1:3000/manifest.webmanifest | grep -q '"share_target"' || { echo 'manifest missing'; exit 1; }
          curl -fsS -o /dev/null http://127.0.0.1:3000/icons/icon-512.png || { echo 'icons missing from the image'; exit 1; }
          curl -fsS http://127.0.0.1:3000/about >/dev/null

          sleep 2
          curl -fsS http://127.0.0.1:3000/about >/dev/null
          docker logs sera-web-ci 2>&1 | tail -n 20
          docker logs sera-web-ci 2>&1 | grep -qiE 'EROFS|read-only file system' && { echo 'web wrote to a read-only path'; exit 1; }

          running=$(docker inspect -f '{{.State.Running}}' sera-web-ci)
          test "$running" = true || { echo 'web container is not running'; exit 1; }

          docker rm -f sera-web-ci sera-api-web-ci sera-redis-web-ci >/dev/null
          docker network rm sera-web-ci >/dev/null

      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0
        with:
          image-ref: ${{ env.IMAGE_API }}:verify
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan Web image with Trivy
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0
        with:
          image-ref: ${{ env.IMAGE_WEB }}:verify
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Publish API image
        if: env.PUSH == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Publish web image
        if: env.PUSH == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_WEB }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Move latest to this commit, for both images together
        if: env.PUSH == 'true'
        run: |
          for image in "$IMAGE_API" "$IMAGE_WEB"; do
            docker buildx imagetools create --tag "$image:latest" "$image:$GITHUB_SHA"
          done

      - name: Confirm both architectures were published
        if: env.PUSH == 'true'
        run: |
          for image in "$IMAGE_API" "$IMAGE_WEB"; do
            echo "== $image"
            docker buildx imagetools inspect "$image:latest" \
              | grep -E "Platform|Name:" | head -n 8
            docker buildx imagetools inspect "$image:latest" | grep -q "linux/arm64" \
              || { echo "arm64 missing from $image"; exit 1; }
          done
