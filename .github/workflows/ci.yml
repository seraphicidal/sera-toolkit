name: CI

# Every push and pull request runs the same gate the deploy job depends on, so a broken
# commit is caught before it can become a broken production image.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The Redis driver is the one part of the engine a mock cannot stand in for: BullMQ's
    # own constructor validation, custom job ids and cross-connection pub/sub all behave
    # differently against a fake. Skipping it here is how a queue name BullMQ rejects
    # reached a production server.
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      # FFmpeg is a real dependency of the test suite: the end-to-end tests generate
      # media with it and read every produced file back with ffprobe.
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      # yt-dlp is pinned so CI exercises the same extractor as production.
      - name: Install yt-dlp
        run: |
          VERSION=$(node -p "require('./scripts/tools.manifest.json').ytdlp.version")
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o /tmp/yt-dlp \
            "https://github.com/yt-dlp/yt-dlp/releases/download/${VERSION}/yt-dlp_linux"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o /tmp/SHA2-256SUMS \
            "https://github.com/yt-dlp/yt-dlp/releases/download/${VERSION}/SHA2-256SUMS"
          EXPECTED=$(grep ' yt-dlp_linux$' /tmp/SHA2-256SUMS | cut -d' ' -f1)
          ACTUAL=$(sha256sum /tmp/yt-dlp | cut -d' ' -f1)
          test -n "$EXPECTED" && test "$EXPECTED" = "$ACTUAL"
          sudo install -m 0755 /tmp/yt-dlp /usr/local/bin/yt-dlp
          yt-dlp --version

      - name: Format
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          # Unset, the Redis integration tests skip themselves. Set, they run.
          SERA_TEST_REDIS_URL: redis://127.0.0.1:6379

      - name: Build
        run: npm run build

      # The reverse proxy's config is as load-bearing as the application's, and it fails
      # in a way nothing in the test suite can see: a Caddyfile Caddy refuses means the
      # site has no TLS terminator at all. Both states are checked because the bug that
      # prompted this was in the one where the optional ACME contact is absent.
      # SERA_API_URL is baked into the web bundle at build time and read again at run
      # time by server components. If the Dockerfile default and the compose value ever
      # disagree, /api/* proxies to a host that does not exist and every request 500s.
      - name: Check the API URL is the same at build time and run time
        run: |
          baked=$(grep -oP '^ARG SERA_API_URL=K.*' docker/web.Dockerfile)
          runtime=$(grep -oP '^s+SERA_API_URL:s*KS+' deploy/docker-compose.oracle.yml | head -n 1)
          echo "built with: $baked"
          echo "run with:   $runtime"
          test -n "$baked" && test "$baked" = "$runtime"

      - name: Validate the Caddyfile
        run: |
          mkdir -p /tmp/globals-none /tmp/globals-email
          echo 'email ci@example.test' > /tmp/globals-email/email.caddy
          for globals in /tmp/globals-none /tmp/globals-email; do
            echo "== globals: $globals"
            docker run --rm -e SERA_DOMAIN=example.test -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$globals:/etc/caddy/globals:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done

  images:
    name: Build container images
    runs-on: ubuntu-latest
    # The arm64 half is emulated, so it is slower than a native build by a wide margin.
    timeout-minutes: 60
    # Only after the code gate passes: an image built from failing code is not useful,
    # and building it anyway would let a red build produce a green-looking artefact.
    needs: verify

    env:
      # Registry-qualified even when only building locally. An unqualified tag like
      # `sera-api:ci` resolves to Docker Hub, and `push: true` then tries to publish
      # it there and fails on auth.
      IMAGE_API: ghcr.io/${{ github.repository_owner }}/sera-api
      IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/sera-web
      PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

    steps:
      - uses: actions/checkout@v5

      # arm64 matters specifically: Oracle Cloud's always-free tier is Ampere, and an
      # amd64-only image simply will not start there.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built for this runner's architecture and loaded, so the steps below can actually
      # execute it. `load` cannot accept a multi-platform build, which is why publishing
      # is a separate step rather than one build doing both.
      - name: Build API image (amd64, for verification)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_API }}:verify
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # A container that starts but cannot run its tools is a deployment that fails at
      # the first download rather than at boot, so both binaries are exercised here.
      - name: Verify the API image has working media tools
        run: |
          docker run --rm --entrypoint yt-dlp "$IMAGE_API:verify" --version
          docker run --rm --entrypoint ffmpeg "$IMAGE_API:verify" -version | head -n 1
          docker run --rm --entrypoint ffprobe "$IMAGE_API:verify" -version | head -n 1

      # Booted the way the compose file boots it — Redis driver, API and worker in
      # separate containers — because the memory driver shares almost no code with it.
      # The failure this replaces was a crash inside the Redis backend's constructor,
      # which a memory-driver smoke test cannot reach.
      - name: Verify the API and worker images boot against Redis
        run: |
          docker network create sera-ci >/dev/null
          docker run -d --name sera-redis-ci --network sera-ci redis:7.4-alpine >/dev/null

          common="-e NODE_ENV=production
            -e SERA_SECRET=ci-smoke-secret-not-used-in-production
            -e SERA_QUEUE_DRIVER=redis
            -e SERA_REDIS_URL=redis://sera-redis-ci:6379"

          # shellcheck disable=SC2086
          docker run -d --name sera-api-ci --network sera-ci $common -e SERA_EMBEDDED_WORKER=false -p 4000:4000 "$IMAGE_API:verify" >/dev/null
          # shellcheck disable=SC2086
          docker run -d --name sera-worker-ci --network sera-ci $common "$IMAGE_API:verify" node apps/worker/dist/index.js >/dev/null

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/health >/dev/null 2>&1; then break; fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:4000/health | tee /tmp/health.json
          node -e "
            const r = require('/tmp/health.json');
            if (r.status !== 'ok') { console.error('health not ok:', r); process.exit(1); }
            console.log('health ok, version', r.version);
          "
          curl -fsS http://127.0.0.1:4000/ready > /dev/null

          # A restart loop looks identical to a healthy boot if you only check once. Both
          # containers must still be up, and the worker has no health endpoint of its own.
          for name in sera-api-ci sera-worker-ci; do
            echo "== $name"
            docker logs "$name" 2>&1 | tail -n 20
            running=$(docker inspect -f '{{.State.Running}}' "$name")
            restarts=$(docker inspect -f '{{.RestartCount}}' "$name")
            test "$running" = true || { echo "$name is not running"; exit 1; }
            test "$restarts" = 0 || { echo "$name restarted $restarts time(s)"; exit 1; }
          done

          docker rm -f sera-api-ci sera-worker-ci sera-redis-ci >/dev/null
          docker network rm sera-ci >/dev/null

      - name: Build web image (amd64, build check)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_WEB }}:verify
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Booted, not just built. The web container runs with a read-only root filesystem
      # and reaches the API only over the compose network, so "it compiled" says nothing
      # about whether it serves a page.
      - name: Verify the web image boots and proxies to the API
        run: |
          docker network create sera-web-ci >/dev/null
          docker run -d --name sera-redis-web-ci --network sera-web-ci redis:7.4-alpine >/dev/null
          # The alias matters: Next baked "http://api:4000" into the rewrite at build time,
          # so the API has to answer to that name.
          docker run -d --name sera-api-web-ci --network sera-web-ci --network-alias api -e NODE_ENV=production -e SERA_SECRET=ci-smoke-secret-not-used-in-production -e SERA_QUEUE_DRIVER=redis -e SERA_REDIS_URL=redis://sera-redis-web-ci:6379 "$IMAGE_API:verify" >/dev/null
          docker run -d --name sera-web-ci --network sera-web-ci -e SERA_API_URL=http://sera-api-web-ci:4000 --read-only --tmpfs /tmp --tmpfs /app/apps/web/.next/cache -p 3000:3000 "$IMAGE_WEB:verify" >/dev/null

          # The web root is static and answers before the API is listening, so waiting on
          # it alone proves nothing about the proxy.
          for _ in $(seq 1 40); do
            if docker exec sera-api-web-ci node -e "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then break; fi
            sleep 2
          done

          # The page itself, then the two things it depends on: the rewrite to the API,
          # and a route that renders server-side against it.
          curl -fsS http://127.0.0.1:3000/ | grep -q 'SERA' || { echo 'home page did not render'; exit 1; }
          curl -fsS http://127.0.0.1:3000/health | grep -q '"status":"ok"' || { echo 'rewrite to the API did not work'; exit 1; }
          curl -fsS http://127.0.0.1:3000/about >/dev/null

          # ISR revalidation writes to the cache; a read-only mount would surface here.
          sleep 2
          curl -fsS http://127.0.0.1:3000/about >/dev/null
          docker logs sera-web-ci 2>&1 | tail -n 20
          docker logs sera-web-ci 2>&1 | grep -qi 'EROFS|read-only file system' && { echo 'web wrote to a read-only path'; exit 1; }

          running=$(docker inspect -f '{{.State.Running}}' sera-web-ci)
          test "$running" = true || { echo 'web container is not running'; exit 1; }

          docker rm -f sera-web-ci sera-api-web-ci sera-redis-web-ci >/dev/null
          docker network rm sera-web-ci >/dev/null

      # Published for both architectures once the amd64 build has proved itself.
      - name: Publish API image
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Publish web image
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Confirm both architectures were published
        if: env.PUSH == 'true'
        run: |
          for image in "$IMAGE_API" "$IMAGE_WEB"; do
            echo "== $image"
            docker buildx imagetools inspect "$image:latest" \
              | grep -E "Platform|Name:" | head -n 8
            docker buildx imagetools inspect "$image:latest" | grep -q "linux/arm64" \
              || { echo "arm64 missing from $image"; exit 1; }
          done
