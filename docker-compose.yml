name: sera-toolkit

services:
  web:
    image: ${SERA_IMAGE_WEB:-ghcr.io/seraphicidal/sera-web:latest}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        SERA_API_URL: http://api:4000
    environment:
      SERA_API_URL: http://api:4000
      OPERATOR_NAME: ${OPERATOR_NAME:-${NEXT_PUBLIC_OPERATOR_NAME:-}}
      OPERATOR_ADDRESS: ${OPERATOR_ADDRESS:-${NEXT_PUBLIC_OPERATOR_ADDRESS:-}}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-${NEXT_PUBLIC_OPERATOR_EMAIL:-}}
      OPERATOR_REGISTRATION_ID: ${OPERATOR_REGISTRATION_ID:-${NEXT_PUBLIC_OPERATOR_REGISTRATION_ID:-}}
      CONTACT_EMAIL_AUTHORITIES: ${CONTACT_EMAIL_AUTHORITIES:-${NEXT_PUBLIC_CONTACT_EMAIL_AUTHORITIES:-}}
      CONTACT_EMAIL_LEGAL: ${CONTACT_EMAIL_LEGAL:-${NEXT_PUBLIC_CONTACT_EMAIL_LEGAL:-}}
      NEXT_PUBLIC_OPERATOR_NAME: ${NEXT_PUBLIC_OPERATOR_NAME:-${OPERATOR_NAME:-}}
      NEXT_PUBLIC_OPERATOR_ADDRESS: ${NEXT_PUBLIC_OPERATOR_ADDRESS:-${OPERATOR_ADDRESS:-}}
      NEXT_PUBLIC_OPERATOR_EMAIL: ${NEXT_PUBLIC_OPERATOR_EMAIL:-${OPERATOR_EMAIL:-}}
      NEXT_PUBLIC_OPERATOR_REGISTRATION_ID: ${NEXT_PUBLIC_OPERATOR_REGISTRATION_ID:-${OPERATOR_REGISTRATION_ID:-}}
      NEXT_PUBLIC_CONTACT_EMAIL_AUTHORITIES: ${NEXT_PUBLIC_CONTACT_EMAIL_AUTHORITIES:-${CONTACT_EMAIL_AUTHORITIES:-}}
      NEXT_PUBLIC_CONTACT_EMAIL_LEGAL: ${NEXT_PUBLIC_CONTACT_EMAIL_LEGAL:-${CONTACT_EMAIL_LEGAL:-}}
    ports:
      - '${SERA_WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge-net
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    image: ${SERA_IMAGE_API:-ghcr.io/seraphicidal/sera-api:latest}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      NODE_ENV: production
      SERA_SECRET: ${SERA_SECRET:?set SERA_SECRET in .env — see .env.example}
      SERA_CORS_ORIGINS: ${SERA_CORS_ORIGINS:-}
      SERA_QUEUE_DRIVER: redis
      SERA_REDIS_URL: ${SERA_REDIS_URL:-redis://:${SERA_REDIS_PASSWORD:-sera_secure_redis}@redis:6379}
      SERA_EMBEDDED_WORKER: 'false'
      SERA_DATA_DIR: /data
      SERA_RETENTION_SECONDS: ${SERA_RETENTION_SECONDS:-1800}
      SERA_REAP_INTERVAL_SECONDS: ${SERA_REAP_INTERVAL_SECONDS:-120}
      SERA_OPTION_TTL_SECONDS: ${SERA_OPTION_TTL_SECONDS:-3600}
      SERA_MAX_FILESIZE_BYTES: ${SERA_MAX_FILESIZE_BYTES:-4294967296}
      SERA_MAX_DURATION_SECONDS: ${SERA_MAX_DURATION_SECONDS:-14400}
      SERA_MAX_ITEMS_PER_JOB: ${SERA_MAX_ITEMS_PER_JOB:-25}
      SERA_JOB_TIMEOUT_SECONDS: ${SERA_JOB_TIMEOUT_SECONDS:-1800}
      SERA_RESOLVE_TIMEOUT_SECONDS: ${SERA_RESOLVE_TIMEOUT_SECONDS:-45}
      SERA_RESOLVE_TIMEOUT_YOUTUBE_SECONDS: ${SERA_RESOLVE_TIMEOUT_YOUTUBE_SECONDS:-60}
      SERA_RESOLVE_TIMEOUT_INSTAGRAM_SECONDS: ${SERA_RESOLVE_TIMEOUT_INSTAGRAM_SECONDS:-30}
      SERA_RESOLVE_TIMEOUT_TWITTER_SECONDS: ${SERA_RESOLVE_TIMEOUT_TWITTER_SECONDS:-25}
      SERA_RESOLVE_TIMEOUT_REDDIT_SECONDS: ${SERA_RESOLVE_TIMEOUT_REDDIT_SECONDS:-25}
      SERA_REDDIT_CLIENT_ID: ${SERA_REDDIT_CLIENT_ID:-}
      SERA_REDDIT_CLIENT_SECRET: ${SERA_REDDIT_CLIENT_SECRET:-}
      SERA_YOUTUBE_PLAYER_CLIENTS: ${SERA_YOUTUBE_PLAYER_CLIENTS:-}
      SERA_YOUTUBE_POT_PROVIDER_URL: ${SERA_YOUTUBE_POT_PROVIDER_URL:-}
      SERA_INSTAGRAM_SESSION_ID: ${SERA_INSTAGRAM_SESSION_ID:-}
      SERA_EXTRACTION_NODE_TOKENS: ${SERA_EXTRACTION_NODE_TOKENS:-}
      SERA_EXTRACTION_NODE_TOKEN: ${SERA_EXTRACTION_NODE_TOKEN:-}
      SERA_EXTRACTION_WORKER_TOKEN: ${SERA_EXTRACTION_WORKER_TOKEN:-}
      SERA_CANARY_TOKEN: ${SERA_CANARY_TOKEN:-}
      SERA_ADMIN_TOKEN: ${SERA_ADMIN_TOKEN:-}
      SERA_ALERT_NTFY_TOPIC: ${SERA_ALERT_NTFY_TOPIC:-}
      SERA_DOMAIN: ${SERA_DOMAIN:-}
      SERA_EXTRACTION_CLAIM_HOLD_SECONDS: ${SERA_EXTRACTION_CLAIM_HOLD_SECONDS:-25}
      SERA_NETWORK_CLASS: ${SERA_NETWORK_CLASS:-unknown}
      SERA_EXTRACTION_PROXY_URL: ${SERA_EXTRACTION_PROXY_URL:-}
      SERA_EXTRACTION_PROXY_PROVIDERS: ${SERA_EXTRACTION_PROXY_PROVIDERS:-}
      SERA_MAX_QUEUE_DEPTH: ${SERA_MAX_QUEUE_DEPTH:-200}
      SERA_RATE_LIMIT_RESOLVE_PER_MINUTE: ${SERA_RATE_LIMIT_RESOLVE_PER_MINUTE:-20}
      SERA_RATE_LIMIT_JOBS_PER_MINUTE: ${SERA_RATE_LIMIT_JOBS_PER_MINUTE:-10}
      SERA_MAX_CONCURRENT_JOBS_PER_CLIENT: ${SERA_MAX_CONCURRENT_JOBS_PER_CLIENT:-3}
      SERA_EXTRA_ALLOWED_HOSTS: ${SERA_EXTRA_ALLOWED_HOSTS:-}
      SERA_BLOCKED_HOSTS: ${SERA_BLOCKED_HOSTS:-}
      SERA_ENABLED_PROVIDERS: ${SERA_ENABLED_PROVIDERS:-}
      SERA_DISABLED_PROVIDERS: ${SERA_DISABLED_PROVIDERS:-}
      SERA_ALLOW_PRIVATE_ADDRESSES: ${SERA_ALLOW_PRIVATE_ADDRESSES:-false}
      SERA_TRUST_PROXY: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - media:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - edge-net
      - internal-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: ${SERA_API_MEMORY:-1g}

  worker:
    image: ${SERA_IMAGE_API:-ghcr.io/seraphicidal/sera-api:latest}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    stop_grace_period: 10m
    command: ['node', 'apps/worker/dist/index.js']
    environment:
      NODE_ENV: production
      SERA_SECRET: ${SERA_SECRET:?set SERA_SECRET in .env — see .env.example}
      SERA_QUEUE_DRIVER: redis
      SERA_REDIS_URL: ${SERA_REDIS_URL:-redis://:${SERA_REDIS_PASSWORD:-sera_secure_redis}@redis:6379}
      SERA_DATA_DIR: /data
      SERA_API_URL: http://api:4000
      SERA_WORKER_CONCURRENCY: ${SERA_WORKER_CONCURRENCY:-2}
      SERA_ITEM_CONCURRENCY: ${SERA_ITEM_CONCURRENCY:-3}
      SERA_FFMPEG_THREADS: ${SERA_FFMPEG_THREADS:-2}
      SERA_RETENTION_SECONDS: ${SERA_RETENTION_SECONDS:-1800}
      SERA_REAP_INTERVAL_SECONDS: ${SERA_REAP_INTERVAL_SECONDS:-120}
      SERA_MAX_FILESIZE_BYTES: ${SERA_MAX_FILESIZE_BYTES:-4294967296}
      SERA_MAX_DURATION_SECONDS: ${SERA_MAX_DURATION_SECONDS:-14400}
      SERA_MAX_ITEMS_PER_JOB: ${SERA_MAX_ITEMS_PER_JOB:-25}
      SERA_JOB_TIMEOUT_SECONDS: ${SERA_JOB_TIMEOUT_SECONDS:-1800}
      SERA_RESOLVE_TIMEOUT_SECONDS: ${SERA_RESOLVE_TIMEOUT_SECONDS:-45}
      SERA_RESOLVE_TIMEOUT_YOUTUBE_SECONDS: ${SERA_RESOLVE_TIMEOUT_YOUTUBE_SECONDS:-60}
      SERA_RESOLVE_TIMEOUT_INSTAGRAM_SECONDS: ${SERA_RESOLVE_TIMEOUT_INSTAGRAM_SECONDS:-30}
      SERA_RESOLVE_TIMEOUT_TWITTER_SECONDS: ${SERA_RESOLVE_TIMEOUT_TWITTER_SECONDS:-25}
      SERA_RESOLVE_TIMEOUT_REDDIT_SECONDS: ${SERA_RESOLVE_TIMEOUT_REDDIT_SECONDS:-25}
      SERA_YOUTUBE_PLAYER_CLIENTS: ${SERA_YOUTUBE_PLAYER_CLIENTS:-}
      SERA_YOUTUBE_POT_PROVIDER_URL: ${SERA_YOUTUBE_POT_PROVIDER_URL:-}
      SERA_REDDIT_CLIENT_ID: ${SERA_REDDIT_CLIENT_ID:-}
      SERA_REDDIT_CLIENT_SECRET: ${SERA_REDDIT_CLIENT_SECRET:-}
      SERA_INSTAGRAM_SESSION_ID: ${SERA_INSTAGRAM_SESSION_ID:-}
      SERA_EXTRACTION_NODE_TOKENS: ${SERA_EXTRACTION_NODE_TOKENS:-}
      SERA_EXTRACTION_NODE_TOKEN: ${SERA_EXTRACTION_NODE_TOKEN:-}
      SERA_EXTRACTION_WORKER_TOKEN: ${SERA_EXTRACTION_WORKER_TOKEN:-}
      SERA_EXTRACTION_CLAIM_HOLD_SECONDS: ${SERA_EXTRACTION_CLAIM_HOLD_SECONDS:-25}
      SERA_NETWORK_CLASS: ${SERA_NETWORK_CLASS:-unknown}
      SERA_EXTRACTION_PROXY_URL: ${SERA_EXTRACTION_PROXY_URL:-}
      SERA_EXTRACTION_PROXY_PROVIDERS: ${SERA_EXTRACTION_PROXY_PROVIDERS:-}
      SERA_EXTRA_ALLOWED_HOSTS: ${SERA_EXTRA_ALLOWED_HOSTS:-}
      SERA_BLOCKED_HOSTS: ${SERA_BLOCKED_HOSTS:-}
      SERA_ENABLED_PROVIDERS: ${SERA_ENABLED_PROVIDERS:-}
      SERA_DISABLED_PROVIDERS: ${SERA_DISABLED_PROVIDERS:-}
      SERA_ALLOW_PRIVATE_ADDRESSES: ${SERA_ALLOW_PRIVATE_ADDRESSES:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - media:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '${SERA_WORKER_CPUS:-2}'
          memory: ${SERA_WORKER_MEMORY:-2g}

  redis:
    image: redis:7.4-alpine
    command: >
      redis-server
      --save ''
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --requirepass ${SERA_REDIS_PASSWORD:-sera_secure_redis}
    environment:
      REDISCLI_AUTH: ${SERA_REDIS_PASSWORD:-sera_secure_redis}
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID

networks:
  edge-net:
  internal-net:

volumes:
  media:
